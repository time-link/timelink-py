[pytest]
addopts = -v -W ignore::DeprecationWarning -W ignore::PendingDeprecationWarning -W ignore::UserWarning
testpaths = tests
python_files = test_*.py
python_functions = test_*
log_cli_level = INFO
asyncio_mode = auto
# NiceGUI >= 3 testing plugin: disable auto-execution of a main file;
# the web tests register their own pages with fake app objects.
main_file =
